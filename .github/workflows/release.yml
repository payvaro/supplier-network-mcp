name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune to production dependencies
        run: npm prune --production

      - name: Create tarball
        id: tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="network-mcp-${tag}.tar.gz"
          tar czf "${archive}" dist/ node_modules/ package.json
          sha256sum "${archive}" > "${archive%.tar.gz}.sha256"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${archive%.tar.gz}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.tarball.outputs.archive }}" \
            "${{ steps.tarball.outputs.checksum }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
